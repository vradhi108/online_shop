services:
  react-app:
    build:
      context: .
    container_name: online_shopping_app
    ports:
      - "3000:3000"
    restart: always
    healthcheck: 
      test: ["CMD","curl","-f","http://34.235.87.15:3000/"]
      interval: 60s
      timeout: 10s
      retries: 5
    networks:
      - online_shop

networks:
  online_shop:
    driver: bridge
